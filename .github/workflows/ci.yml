name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rule unit tests
        run: npm test
      - name: Bundle check (wrangler dry run, nothing is deployed)
        run: npx wrangler deploy --dry-run --outdir dist
        env:
          WRANGLER_SEND_METRICS: "false"
